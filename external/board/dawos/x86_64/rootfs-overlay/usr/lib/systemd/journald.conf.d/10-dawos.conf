# dawOS: keep the journal on disk, within fixed bounds.
#
# /var is the "state" partition (32 GiB) on an installed system, so the
# journal survives a reboot: it is the first thing to read after a crash.
# On the installation medium /var is in memory and the same limits simply
# keep the journal small.
[Journal]
Storage=persistent
# Upper bound of the space taken by the journal, and space always left
# free for the rest of the state (measurements, settings, crash dumps).
SystemMaxUse=1G
SystemKeepFree=4G
# One file per week at most, three months of history.
MaxFileSec=1week
MaxRetentionSec=3month
