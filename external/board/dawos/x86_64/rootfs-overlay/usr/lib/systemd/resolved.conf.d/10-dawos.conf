# dawOS: no listening service on the network (binding decision, security).
#
# By default systemd-resolved answers LLMNR (TCP and UDP 5355) and mDNS
# (UDP 5353) on every interface. dawOS only needs to resolve names, never
# to announce or answer them, so both responders are switched off.
# The DNS stub on 127.0.0.53/54 stays: it is reachable from this machine
# only.
[Resolve]
LLMNR=no
MulticastDNS=no

# systemd ships a built-in list of public resolvers used when the network
# provides none. dawOS only talks to the servers the network hands out.
FallbackDNS=
