<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Il carico di riferimento: un'istanza stereo in un registro, stadi e ritocchi" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Il carico di riferimento: un'istanza stereo in un registro, stadi e ritocchi</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="329" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24" y="34" font-size="15" text-anchor="start" fill="#191919" font-weight="600">Il carico di riferimento: filtri veri, misurati</text>
<text x="24" y="70" font-size="11.5" text-anchor="start" fill="#666666">Un registro da 256 bit: otto numeri, cioè un'istanza stereo divisa in quattro bande</text>
<rect x="24" y="80" width="52" height="30" rx="4" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<text x="50" y="98.675" font-size="10.5" text-anchor="middle" fill="#191919">S banda 1</text>
<rect x="80" y="80" width="52" height="30" rx="4" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<text x="106" y="98.675" font-size="10.5" text-anchor="middle" fill="#191919">S banda 2</text>
<rect x="136" y="80" width="52" height="30" rx="4" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<text x="162" y="98.675" font-size="10.5" text-anchor="middle" fill="#191919">S banda 3</text>
<rect x="192" y="80" width="52" height="30" rx="4" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<text x="218" y="98.675" font-size="10.5" text-anchor="middle" fill="#191919">S banda 4</text>
<rect x="248" y="80" width="52" height="30" rx="4" fill="#c9f0e8" stroke="#00b894" stroke-width="1"/>
<text x="274" y="98.675" font-size="10.5" text-anchor="middle" fill="#191919">D banda 1</text>
<rect x="304" y="80" width="52" height="30" rx="4" fill="#c9f0e8" stroke="#00b894" stroke-width="1"/>
<text x="330" y="98.675" font-size="10.5" text-anchor="middle" fill="#191919">D banda 2</text>
<rect x="360" y="80" width="52" height="30" rx="4" fill="#c9f0e8" stroke="#00b894" stroke-width="1"/>
<text x="386" y="98.675" font-size="10.5" text-anchor="middle" fill="#191919">D banda 3</text>
<rect x="416" y="80" width="52" height="30" rx="4" fill="#c9f0e8" stroke="#00b894" stroke-width="1"/>
<text x="442" y="98.675" font-size="10.5" text-anchor="middle" fill="#191919">D banda 4</text>
<text x="486" y="92" font-size="11.5" text-anchor="start" fill="#666666">S: canale sinistro</text>
<text x="486" y="108" font-size="11.5" text-anchor="start" fill="#666666">D: canale destro</text>
<text x="24" y="144" font-size="11.5" text-anchor="start" fill="#666666">Per ogni blocco: tanti stadi quanti ne servono, poi i ritocchi</text>
<rect x="24" y="150" width="84" height="44" rx="4" fill="#f4f4f4" stroke="#d9d9d9" stroke-width="1"/>
<text x="66" y="168.55" font-size="11.5" text-anchor="middle" fill="#191919">ingresso</text>
<text x="66" y="183.5" font-size="11.5" text-anchor="middle" fill="#191919">S e D</text>
<rect x="122" y="150" width="84" height="44" rx="4" fill="#fde0d2" stroke="#f47230" stroke-width="1"/>
<text x="164" y="168.55" font-size="11.5" text-anchor="middle" fill="#191919">stadio 1</text>
<text x="164" y="183.5" font-size="11.5" text-anchor="middle" fill="#191919">passa-tutto</text>
<line x1="108" y1="172" x2="120" y2="172" stroke="#666666" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="220" y="150" width="84" height="44" rx="4" fill="#fde0d2" stroke="#f47230" stroke-width="1"/>
<text x="262" y="168.55" font-size="11.5" text-anchor="middle" fill="#191919">stadio 2</text>
<text x="262" y="183.5" font-size="11.5" text-anchor="middle" fill="#191919">passa-tutto</text>
<line x1="206" y1="172" x2="218" y2="172" stroke="#666666" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="318" y="150" width="84" height="44" rx="4" fill="#fde0d2" stroke="#f47230" stroke-width="1"/>
<text x="360" y="168.55" font-size="11.5" text-anchor="middle" fill="#191919">stadio 3</text>
<text x="360" y="183.5" font-size="11.5" text-anchor="middle" fill="#191919">passa-tutto</text>
<line x1="304" y1="172" x2="316" y2="172" stroke="#666666" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="416" y="150" width="84" height="44" rx="4" fill="#fde0d2" stroke="#f47230" stroke-width="1"/>
<text x="458" y="168.55" font-size="11.5" text-anchor="middle" fill="#191919">stadio 4</text>
<text x="458" y="183.5" font-size="11.5" text-anchor="middle" fill="#191919">passa-tutto</text>
<line x1="402" y1="172" x2="414" y2="172" stroke="#666666" stroke-width="1" marker-end="url(#arrow)"/>
<text x="502" y="162" font-size="14" text-anchor="start" fill="#666666">…</text>
<rect x="528" y="150" width="70" height="44" rx="4" fill="#fcebc4" stroke="#f2a600" stroke-width="1"/>
<text x="563" y="168.55" font-size="11.5" text-anchor="middle" fill="#191919">ritocco 1</text>
<text x="563" y="183.5" font-size="11.5" text-anchor="middle" fill="#191919">× costante</text>
<line x1="514" y1="172" x2="526" y2="172" stroke="#666666" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="612" y="150" width="70" height="44" rx="4" fill="#fcebc4" stroke="#f2a600" stroke-width="1"/>
<text x="647" y="168.55" font-size="11.5" text-anchor="middle" fill="#191919">ritocco 2</text>
<text x="647" y="183.5" font-size="11.5" text-anchor="middle" fill="#191919">× costante</text>
<line x1="598" y1="172" x2="610" y2="172" stroke="#666666" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="696" y="150" width="60" height="44" rx="4" fill="#f4f4f4" stroke="#d9d9d9" stroke-width="1"/>
<text x="726" y="168.55" font-size="11.5" text-anchor="middle" fill="#191919">uscita</text>
<text x="726" y="183.5" font-size="11.5" text-anchor="middle" fill="#191919">S e D</text>
<line x1="682" y1="172" x2="694" y2="172" stroke="#666666" stroke-width="1" marker-end="url(#arrow)"/>
<text x="24" y="228" font-size="12" text-anchor="start" fill="#191919" font-weight="600">Costi misurati sul 285K, per frame, a 96 kHz (P1.7d)</text>
<text x="24" y="248" font-size="12" text-anchor="start" fill="#191919">parte fissa 1,92 ns   ·   uno stadio 1,845 ns   ·   un ritocco 0,207 ns</text>
<text x="24" y="274" font-size="11.5" text-anchor="start" fill="#191919">classe leggera, 10 ns</text>
<text x="220" y="274" font-size="11.5" text-anchor="start" fill="#666666">4 stadi e 2 ritocchi</text>
<text x="400" y="274" font-size="11.5" text-anchor="start" fill="#666666">misurato 9,95 ns</text>
<text x="24" y="292" font-size="11.5" text-anchor="start" fill="#191919">classe media, 40 ns</text>
<text x="220" y="292" font-size="11.5" text-anchor="start" fill="#666666">20 stadi e 4 ritocchi</text>
<text x="400" y="292" font-size="11.5" text-anchor="start" fill="#666666">misurato 40,17 ns</text>
<text x="24" y="310" font-size="11.5" text-anchor="start" fill="#191919">classe pesante, 150 ns</text>
<text x="220" y="310" font-size="11.5" text-anchor="start" fill="#666666">80 stadi</text>
<text x="400" y="310" font-size="11.5" text-anchor="start" fill="#666666">misurato 149,66 ns</text>
</svg>
