<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-label="La protezione K-04: che cosa succede dopo che un thread si blocca" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>La protezione K-04: che cosa succede dopo che un thread si blocca</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="349" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24" y="34" font-size="15" text-anchor="start" fill="#191919" font-weight="600">La protezione K-04: dal blocco di un thread al grafo senza il nodo</text>
<text x="24" y="54" font-size="11.5" text-anchor="start" fill="#666666">Tempi dal blocco, con periodi da 2 ms. L'asse non è in scala dopo i 12 ms.</text>
<line x1="60" y1="190" x2="730" y2="190" stroke="#666666" stroke-width="1"/>
<line x1="60" y1="186" x2="60" y2="194" stroke="#666666" stroke-width="1"/>
<text x="60" y="210" font-size="11" text-anchor="middle" fill="#666666">0</text>
<line x1="128" y1="186" x2="128" y2="194" stroke="#666666" stroke-width="1"/>
<text x="128" y="210" font-size="11" text-anchor="middle" fill="#666666">2</text>
<line x1="196" y1="186" x2="196" y2="194" stroke="#666666" stroke-width="1"/>
<text x="196" y="210" font-size="11" text-anchor="middle" fill="#666666">4</text>
<line x1="264" y1="186" x2="264" y2="194" stroke="#666666" stroke-width="1"/>
<text x="264" y="210" font-size="11" text-anchor="middle" fill="#666666">6</text>
<line x1="332" y1="186" x2="332" y2="194" stroke="#666666" stroke-width="1"/>
<text x="332" y="210" font-size="11" text-anchor="middle" fill="#666666">8</text>
<line x1="400" y1="186" x2="400" y2="194" stroke="#666666" stroke-width="1"/>
<text x="400" y="210" font-size="11" text-anchor="middle" fill="#666666">10</text>
<line x1="468" y1="186" x2="468" y2="194" stroke="#666666" stroke-width="1"/>
<text x="468" y="210" font-size="11" text-anchor="middle" fill="#666666">12</text>
<line x1="501.277" y1="186" x2="501.277" y2="194" stroke="#666666" stroke-width="1"/>
<text x="501.277" y="210" font-size="11" text-anchor="middle" fill="#666666">20</text>
<line x1="560.968" y1="186" x2="560.968" y2="194" stroke="#666666" stroke-width="1"/>
<text x="560.968" y="210" font-size="11" text-anchor="middle" fill="#666666">50</text>
<line x1="710.968" y1="186" x2="710.968" y2="194" stroke="#666666" stroke-width="1"/>
<text x="710.968" y="210" font-size="11" text-anchor="middle" fill="#666666">500 ms</text>
<rect x="60" y="146" width="201" height="30" rx="4" fill="#fde0d2" stroke="#f47230" stroke-width="1"/>
<text x="160.5" y="165.025" font-size="11.5" text-anchor="middle" fill="#191919">il thread non ritorna: tre periodi</text>
<line x1="60" y1="98" x2="60" y2="142" stroke="#f47230" stroke-width="1.5"/>
<circle cx="60" cy="146" r="4" fill="#f47230" stroke="#ffffff" stroke-width="2"/>
<text x="66" y="92" font-size="11.5" text-anchor="start" fill="#191919">il blocco</text>
<line x1="298" y1="82" x2="298" y2="190" stroke="#257de0" stroke-width="1.5"/>
<circle cx="298" cy="190" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="304" y="76" font-size="11.5" text-anchor="start" fill="#191919">il cane da guardia se ne accorge</text>
<line x1="308.2" y1="110" x2="308.2" y2="190" stroke="#257de0" stroke-width="1.5"/>
<circle cx="308.2" cy="190" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="314.2" y="104" font-size="11.5" text-anchor="start" fill="#191919">processore libero, nodo abbandonato: silenzio</text>
<line x1="383" y1="138" x2="383" y2="190" stroke="#257de0" stroke-width="1.5"/>
<circle cx="383" cy="190" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"/>
<text x="389" y="132" font-size="11.5" text-anchor="start" fill="#191919">la riserva è al lavoro</text>
<line x1="501.277" y1="166" x2="501.277" y2="190" stroke="#00b894" stroke-width="1.5"/>
<circle cx="501.277" cy="190" r="4" fill="#00b894" stroke="#ffffff" stroke-width="2"/>
<text x="507.277" y="160" font-size="11.5" text-anchor="start" fill="#191919">il grafo senza il nodo è in uso</text>
<text x="24" y="242" font-size="11.5" text-anchor="start" fill="#666666">limiti</text>
<line x1="349" y1="216" x2="349" y2="238" stroke="#dc3c3d" stroke-width="1" stroke-dasharray="3 3"/>
<text x="343" y="242" font-size="11.5" text-anchor="end" fill="#191919">accorgersene: entro 8,5 ms</text>
<line x1="482.537" y1="216" x2="482.537" y2="258" stroke="#dc3c3d" stroke-width="1" stroke-dasharray="3 3"/>
<text x="476.537" y="262" font-size="11.5" text-anchor="end" fill="#191919">processore libero: entro 15 ms</text>
<line x1="560.968" y1="216" x2="560.968" y2="278" stroke="#dc3c3d" stroke-width="1" stroke-dasharray="3 3"/>
<text x="554.968" y="282" font-size="11.5" text-anchor="end" fill="#191919">riserva al lavoro: entro 50 ms</text>
<line x1="710.968" y1="216" x2="710.968" y2="298" stroke="#dc3c3d" stroke-width="1" stroke-dasharray="3 3"/>
<text x="704.968" y="302" font-size="11.5" text-anchor="end" fill="#191919">grafo senza il nodo: entro 500 ms</text>
<text x="24" y="322" font-size="11.5" text-anchor="start" fill="#666666">Misurato sul 285K: visto dopo 6,0–8,0 ms, riserva al lavoro dopo 8–11 ms (P1.3, P1.5).</text>
<text x="24" y="336.95" font-size="11.5" text-anchor="start" fill="#666666">Il grafo senza il nodo: 16–27 ms attesi, da misurare (P1.7f).</text>
</svg>
