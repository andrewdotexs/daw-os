# The graphics driver is not loaded when the kernel finds the GPU: for
# this processor it needs a parameter (force_probe) that only the boot
# profile can justify. dawos-tune loads it by name at every boot for the
# profiles that ask for it (graphics_driver=xe in the profile "285k",
# ADR 0022). Under the profile "generic" nothing loads it, and the
# console stays on the firmware's framebuffer.
blacklist xe
