<text x="24" y="318" font-size="11.5" text-anchor="start" fill="#666666">Un thread guarda quale grafo eseguire una volta sola, a inizio ciclo, e lo tiene fino alla fine: nessuno cambia a metà.</text>
<text x="24" y="332.95" font-size="11.5" text-anchor="start" fill="#666666">Un nodo con lo stesso nome e gli stessi parametri prosegue con il suo stato: 179 scambi, nessun campione perso (P1.7e).</text>
