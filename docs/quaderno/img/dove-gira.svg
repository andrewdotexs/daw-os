<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Dove gira una prova: PC di sviluppo, macchina virtuale, 285K" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Dove gira una prova: PC di sviluppo, macchina virtuale, 285K</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="329" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24" y="34" font-size="15" text-anchor="start" fill="#191919" font-weight="600">Dove gira una prova: tre luoghi, sempre in quest'ordine</text>
<rect x="24" y="64" width="216" height="150" rx="6" fill="#f4f4f4" stroke="#d9d9d9" stroke-width="1"/>
<text x="38" y="90" font-size="13" text-anchor="start" fill="#191919" font-weight="600">1. PC di sviluppo</text>
<text x="38" y="116" font-size="11.5" fill="#191919" font-family="ui-monospace, Menlo, Consolas, monospace">make engine-test</text>
<text x="38" y="134" font-size="11.5" fill="#191919" font-family="ui-monospace, Menlo, Consolas, monospace">make lint</text>
<text x="38" y="152" font-size="11.5" fill="#191919" font-family="ui-monospace, Menlo, Consolas, monospace">make image</text>
<text x="38" y="184" font-size="11.5" text-anchor="start" fill="#666666">la logica del codice,</text>
<text x="38" y="200" font-size="11.5" text-anchor="start" fill="#666666">la forma, l'immagine</text>
<rect x="272" y="64" width="216" height="150" rx="6" fill="#f4f4f4" stroke="#d9d9d9" stroke-width="1"/>
<text x="286" y="90" font-size="13" text-anchor="start" fill="#191919" font-weight="600">2. Macchina virtuale</text>
<text x="286" y="116" font-size="11.5" fill="#191919" font-family="ui-monospace, Menlo, Consolas, monospace">make qemu-test</text>
<text x="286" y="134" font-size="11.5" fill="#191919" font-family="ui-monospace, Menlo, Consolas, monospace">make qemu-audio-test</text>
<text x="286" y="184" font-size="11.5" text-anchor="start" fill="#666666">l'immagine parte, il motore</text>
<text x="286" y="200" font-size="11.5" text-anchor="start" fill="#666666">suona sulla scheda di software</text>
<rect x="520" y="64" width="216" height="150" rx="6" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<text x="534" y="90" font-size="13" text-anchor="start" fill="#191919" font-weight="600">3. 285K</text>
<text x="534" y="116" font-size="11.5" fill="#191919" font-family="ui-monospace, Menlo, Consolas, monospace">make remote-update (dal PC)</text>
<text x="534" y="134" font-size="11.5" fill="#191919" font-family="ui-monospace, Menlo, Consolas, monospace">dawos-audio-test card</text>
<text x="534" y="152" font-size="11.5" fill="#191919" font-family="ui-monospace, Menlo, Consolas, monospace">tools/graph-threads.sh</text>
<text x="534" y="184" font-size="11.5" text-anchor="start" fill="#666666">le misure che contano:</text>
<text x="534" y="200" font-size="11.5" text-anchor="start" fill="#666666">i tempi, la scheda vera</text>
<line x1="242" y1="124" x2="270" y2="124" stroke="#666666" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="490" y1="124" x2="518" y2="124" stroke="#666666" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M628,216 V258 H134 V218" stroke="#f47230" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
<text x="380" y="250" font-size="11.5" text-anchor="middle" fill="#191919">make measure-fetch: i file delle misure tornano nel repository, controllati</text>
<text x="24" y="292" font-size="11.5" text-anchor="start" fill="#666666">Se una prova fallisce in un luogo non si passa al successivo. La macchina virtuale prova la logica, non i tempi:</text>
<text x="24" y="306.95" font-size="11.5" text-anchor="start" fill="#666666">con KVM gira alla velocità del processore, senza è emulata e il cane da guardia prende per bloccati i thread lenti.</text>
</svg>
