<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Il giro di un campione: per il cavo e dentro l'interfaccia" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Il giro di un campione: per il cavo e dentro l'interfaccia</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="359" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24" y="34" font-size="15" text-anchor="start" fill="#191919" font-weight="600">Il giro: da un campione scritto allo stesso campione riletto</text>
<rect x="24" y="150" width="110" height="70" rx="4" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<text x="79" y="181.4" font-size="12" text-anchor="middle" fill="#191919" font-weight="600">dawos-engine</text>
<text x="79" y="197" font-size="12" text-anchor="middle" fill="#191919">scrive e rilegge</text>
<rect x="170" y="70" width="130" height="50" rx="4" fill="#f4f4f4" stroke="#d9d9d9" stroke-width="1"/>
<text x="235" y="91.55" font-size="11.5" text-anchor="middle" fill="#191919">buffer di uscita</text>
<text x="235" y="106.5" font-size="11.5" text-anchor="middle" fill="#191919">3 periodi: 6 ms</text>
<rect x="316" y="70" width="76" height="50" rx="4" fill="#f4f4f4" stroke="#d9d9d9" stroke-width="1"/>
<text x="354" y="99.025" font-size="11.5" text-anchor="middle" fill="#191919">USB</text>
<rect x="408" y="70" width="120" height="50" rx="4" fill="#fcebc4" stroke="#f2a600" stroke-width="1"/>
<text x="468" y="91.55" font-size="11.5" text-anchor="middle" fill="#191919">router</text>
<text x="468" y="106.5" font-size="11.5" text-anchor="middle" fill="#191919">dell'interfaccia</text>
<rect x="544" y="70" width="96" height="50" rx="4" fill="#fcebc4" stroke="#f2a600" stroke-width="1"/>
<text x="592" y="91.55" font-size="11.5" text-anchor="middle" fill="#191919">convertitore</text>
<text x="592" y="106.5" font-size="11.5" text-anchor="middle" fill="#191919">in analogico</text>
<rect x="170" y="250" width="130" height="50" rx="4" fill="#f4f4f4" stroke="#d9d9d9" stroke-width="1"/>
<text x="235" y="271.55" font-size="11.5" text-anchor="middle" fill="#191919">buffer di ingresso</text>
<text x="235" y="286.5" font-size="11.5" text-anchor="middle" fill="#191919">1 periodo: 2 ms</text>
<rect x="316" y="250" width="76" height="50" rx="4" fill="#f4f4f4" stroke="#d9d9d9" stroke-width="1"/>
<text x="354" y="279.025" font-size="11.5" text-anchor="middle" fill="#191919">USB</text>
<rect x="408" y="250" width="120" height="50" rx="4" fill="#fcebc4" stroke="#f2a600" stroke-width="1"/>
<text x="468" y="271.55" font-size="11.5" text-anchor="middle" fill="#191919">router</text>
<text x="468" y="286.5" font-size="11.5" text-anchor="middle" fill="#191919">dell'interfaccia</text>
<rect x="544" y="250" width="96" height="50" rx="4" fill="#fcebc4" stroke="#f2a600" stroke-width="1"/>
<text x="592" y="271.55" font-size="11.5" text-anchor="middle" fill="#191919">convertitore</text>
<text x="592" y="286.5" font-size="11.5" text-anchor="middle" fill="#191919">in digitale</text>
<path d="M79,150 V95.0 H168" stroke="#666666" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="300" y1="95" x2="314" y2="95" stroke="#666666" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="392" y1="95" x2="406" y2="95" stroke="#666666" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="528" y1="95" x2="542" y2="95" stroke="#666666" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M640,95.0 H700 V275.0 H642" stroke="#f47230" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="708" y="180" font-size="12" text-anchor="start" fill="#191919">cavo</text>
<text x="708" y="196" font-size="11.5" text-anchor="start" fill="#666666">3 → 3</text>
<path d="M468,120 V248" stroke="#00b894" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="476" y="176" font-size="12" text-anchor="start" fill="#191919">dentro l'interfaccia</text>
<text x="476" y="192" font-size="11.5" text-anchor="start" fill="#666666">5 → 5, 6 → 6: bit per bit</text>
<line x1="542" y1="275" x2="530" y2="275" stroke="#666666" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="406" y1="275" x2="394" y2="275" stroke="#666666" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="314" y1="275" x2="302" y2="275" stroke="#666666" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M168,275.0 H79 V222" stroke="#666666" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<text x="24" y="330" font-size="11.5" text-anchor="start" fill="#666666">Per il cavo il giro si misura con le raffiche (ci sono i convertitori); dentro l'interfaccia con il conteggio, al campione.</text>
<text x="24" y="344.95" font-size="11.5" text-anchor="start" fill="#666666">Giro = buffer + una costante del driver: 0,4–0,5 ms sulla seconda generazione, 3,4–3,7 ms sulla quarta.</text>
</svg>
