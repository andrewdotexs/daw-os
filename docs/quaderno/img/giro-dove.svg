<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Dove passa il tempo del giro dentro l'interfaccia a 48 kHz, con una e con quattro fette" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Dove passa il tempo del giro dentro l'interfaccia a 48 kHz, con una e con quattro fette</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="299" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24" y="34" font-size="15" text-anchor="start" fill="#191919" font-weight="600">Dove stanno i millisecondi del giro (48 kHz, forma 96:3)</text>
<text x="24" y="54" font-size="11.5" text-anchor="start" fill="#666666">Giro dentro l'interfaccia, dal motore al motore; letto sul bus USB nel passo P1.8b</text>
<line x1="130" y1="92" x2="130" y2="214" stroke="#d9d9d9" stroke-width="1"/>
<text x="130" y="230" font-size="11" text-anchor="middle" fill="#666666">0 ms</text>
<line x1="220" y1="92" x2="220" y2="214" stroke="#d9d9d9" stroke-width="1"/>
<text x="220" y="230" font-size="11" text-anchor="middle" fill="#666666">2 ms</text>
<line x1="310" y1="92" x2="310" y2="214" stroke="#d9d9d9" stroke-width="1"/>
<text x="310" y="230" font-size="11" text-anchor="middle" fill="#666666">4 ms</text>
<line x1="400" y1="92" x2="400" y2="214" stroke="#d9d9d9" stroke-width="1"/>
<text x="400" y="230" font-size="11" text-anchor="middle" fill="#666666">6 ms</text>
<line x1="490" y1="92" x2="490" y2="214" stroke="#d9d9d9" stroke-width="1"/>
<text x="490" y="230" font-size="11" text-anchor="middle" fill="#666666">8 ms</text>
<line x1="580" y1="92" x2="580" y2="214" stroke="#d9d9d9" stroke-width="1"/>
<text x="580" y="230" font-size="11" text-anchor="middle" fill="#666666">10 ms</text>
<text x="118" y="123" font-size="12" text-anchor="end" fill="#191919">una fetta</text>
<rect x="131" y="104" width="268" height="28" rx="4" fill="#257de0"/>
<rect x="401" y="104" width="132.1" height="28" rx="4" fill="#f47230"/>
<rect x="535.1" y="104" width="23.65" height="28" rx="4" fill="#00b894"/>
<text x="265" y="123" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="600">6,00</text>
<text x="467.05" y="123" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="600">2,98</text>
<text x="567.75" y="123" font-size="11.5" text-anchor="start" fill="#666666">0,57   in tutto 9,54 ms</text>
<text x="118" y="185" font-size="12" text-anchor="end" fill="#191919">quattro fette</text>
<rect x="131" y="166" width="268" height="28" rx="4" fill="#257de0"/>
<rect x="401" y="166" width="108.25" height="28" rx="4" fill="#f47230"/>
<rect x="511.25" y="166" width="24.55" height="28" rx="4" fill="#00b894"/>
<text x="265" y="185" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="600">6,00</text>
<text x="455.125" y="185" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="600">2,45</text>
<text x="544.8" y="185" font-size="11.5" text-anchor="start" fill="#666666">0,59   in tutto 9,04 ms</text>
<rect x="130" y="258" width="14" height="10" rx="3" fill="#257de0"/>
<text x="150" y="267" font-size="11.5" text-anchor="start" fill="#191919">il buffer: tre cicli del motore</text>
<rect x="330" y="258" width="14" height="10" rx="3" fill="#f47230"/>
<text x="350" y="267" font-size="11.5" text-anchor="start" fill="#191919">l'uscita presso il controller USB</text>
<rect x="550" y="258" width="14" height="10" rx="3" fill="#00b894"/>
<text x="570" y="267" font-size="11.5" text-anchor="start" fill="#191919">interfaccia e avvio</text>
</svg>
