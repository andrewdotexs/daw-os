# Focusrite Scarlett 18i20, 4th generation: the loop dawos-audio-test
# needs, on top of the known state.
#
# Capture channel 5 takes playback channel 5 instead of the analogue
# input 5: what the engine plays on output 5 comes back on input 5
# without a cable, inside the interface.
#
# And line output 5 plays nothing: in the known state it plays playback
# channel 5 at full level, and the signal of the test would come out of
# the socket on the back, into whatever is plugged there.
#
# The same for channel 6: the graph of the case "relay" takes the count
# on input 5 and plays it on output 6, and the engine checks it on
# input 6 (step P1.7c).
#
# All undone at the end of the test.

PCM 5 Capture Enum = PCM 5
Analogue 5 Playback Enum = Off
PCM 6 Capture Enum = PCM 6
Analogue 6 Playback Enum = Off
