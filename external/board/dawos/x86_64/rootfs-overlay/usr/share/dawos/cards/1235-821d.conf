# Focusrite Scarlett 18i20, 4th generation (USB 1235:821d): the known
# state of its router, mixer and preamplifiers, for dawos-card-setup
# (step P1.12).
#
# It is the state read from the interface of the project on 24 November
# 2026, right after the update of its firmware to 3.0.2778.0
# (docs/misure/fase-1/scheda-18i20-quarta-generazione.txt). The controls
# are those fcp-server makes (package fcp-support): without it running
# for the card there is nothing to read or to set.
#
# What matters to the engine:
#
# - capture channels 1-8 take the analogue inputs 1-8; 9-10 take the
#   playback channels 1-2 back (the loop the interface has from the
#   factory); 11-12 S/PDIF, 13-20 ADAT 1-8; 21-26 nothing. At 88.2 and
#   96 kHz the interface has 18 channels each way, at 176.4 and 192 kHz
#   ten: the first ones of this list;
# - line outputs 3-10 play the playback channels 3-10, at full level:
#   WHAT THE ENGINE PLAYS THERE COMES OUT OF THE SOCKETS ON THE BACK;
# - line outputs 1-2 (the monitors) and both headphone pairs play the
#   mixes A and B, which hold the playback channels 1 and 2;
# - the clock is the internal one; the preamplifiers are at gain 0, line
#   level, without phantom power.
#
# Left out on purpose, because they follow knobs and buttons of the
# front panel, or only tell: the master level and the levels of line
# outputs 1-2 and of the headphones (all read -127 dB: the knobs were
# at their lowest, or so it seems); which input the buttons of the panel
# act on; how the last automatic gain ended. And everything fcp-server
# keeps locked: versions, the lock of the clock, the 53 fixed inputs of
# the mixer (playback 1-26, analogue 1-9, S/PDIF, ADAT 1-16).
#
# Names and values are those of `amixer contents`.

# The clock and the digital ports.
Clock Source Clock Source = Internal
Digital I/O Mode Capture Enum = RCA S/PDIF

