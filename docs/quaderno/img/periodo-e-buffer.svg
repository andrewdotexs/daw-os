<rect x="51" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="60" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="69" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="78" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="87" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="96" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="105" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="114" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="123" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="132" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="141" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="150" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="159" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="168" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="177" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="186" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="195" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="204" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="213" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="222" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="231" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<text x="246" y="100" font-size="14" text-anchor="start" fill="#666666">…</text>
<text x="270" y="92" font-size="11.5" text-anchor="start" fill="#666666">un frame: un campione per canale,</text>
<text x="270" y="107" font-size="11.5" text-anchor="start" fill="#666666">nello stesso istante (1/48 000 di secondo)</text>
<text x="24" y="152" font-size="12" text-anchor="start" fill="#666666">Il buffer di uscita: tre periodi, 288 frame, 6 ms</text>
<rect x="150" y="166" width="142" height="56" rx="4" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<text x="221" y="190.4" font-size="12" text-anchor="middle" fill="#191919">periodo 1</text>
<text x="221" y="206" font-size="12" text-anchor="middle" fill="#191919">sta suonando</text>
<rect x="296" y="166" width="142" height="56" rx="4" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<text x="367" y="190.4" font-size="12" text-anchor="middle" fill="#191919">periodo 2</text>
<text x="367" y="206" font-size="12" text-anchor="middle" fill="#191919">pronto</text>
<rect x="442" y="166" width="142" height="56" rx="4" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<text x="513" y="190.4" font-size="12" text-anchor="middle" fill="#191919">periodo 3</text>
<text x="513" y="206" font-size="12" text-anchor="middle" fill="#191919">pronto</text>
<rect x="588" y="166" width="142" height="56" rx="4" fill="#f4f4f4" stroke="#d9d9d9" stroke-width="1"/>
<text x="659" y="190.4" font-size="12" text-anchor="middle" fill="#191919">il prossimo</text>
<text x="659" y="206" font-size="12" text-anchor="middle" fill="#191919">lo scrive il motore</text>
<rect x="24" y="166" width="104" height="56" rx="4" fill="#fcebc4" stroke="#f2a600" stroke-width="1"/>
<text x="76" y="190.4" font-size="12" text-anchor="middle" fill="#191919">la scheda</text>
<text x="76" y="206" font-size="12" text-anchor="middle" fill="#191919">consuma da qui</text>
<line x1="148" y1="194" x2="130" y2="194" stroke="#666666" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="586" y1="244" x2="586" y2="226" stroke="#666666" stroke-width="1" marker-end="url(#arrow)"/>
<text x="586" y="260" font-size="11.5" text-anchor="middle" fill="#666666">il motore scrive qui, un periodo ogni 2 ms</text>
<text x="24" y="290" font-size="11.5" text-anchor="start" fill="#666666">Ogni campione che il motore scrive aspetta in coda dietro a ciò che c'è già: più il buffer è lungo, più tempo ha</text>
<text x="24" y="304.95" font-size="11.5" text-anchor="start" fill="#666666">il motore prima che la scheda resti senza (xrun), e più tardi si sente il suono. Con due periodi non si regge.</text>
</svg>
