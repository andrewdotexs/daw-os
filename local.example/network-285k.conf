# Static network configuration of the reference machine (ADR decision of
# 13 November 2026). Copy this file to local/network-285k.conf and put in
# the real values: local/ is ignored by git, so they never reach the
# repository. Without that file the image uses DHCP on every interface.
#
# The addresses below are documentation examples (RFC 5737), not real ones.

# Kernel driver of the network card the settings apply to. Every other
# wired interface, including the virtual one in QEMU, keeps using DHCP.
DAWOS_NET_DRIVER=igc

# Address with prefix length (a 255.255.255.0 mask is /24).
DAWOS_NET_ADDRESS=192.0.2.23/24

DAWOS_NET_GATEWAY=192.0.2.1

# One or more DNS servers, separated by spaces.
DAWOS_NET_DNS=192.0.2.1
