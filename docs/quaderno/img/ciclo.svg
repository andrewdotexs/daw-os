<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Un ciclo del motore lungo un periodo di 2 ms" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Un ciclo del motore lungo un periodo di 2 ms</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="329" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24" y="34" font-size="15" text-anchor="start" fill="#191919" font-weight="600">Un ciclo del motore: due fasi in un periodo di 2 ms</text>
<text x="24" y="54" font-size="11.5" text-anchor="start" fill="#666666">Non in scala: il risveglio dura microsecondi, il calcolo fino a 1,85 ms.</text>
<rect x="40" y="120" width="106" height="44" rx="4" fill="#f4f4f4" stroke="#d9d9d9" stroke-width="1"/>
<text x="93" y="146.2" font-size="12" text-anchor="middle" fill="#191919">attesa</text>
<rect x="150" y="120" width="42" height="44" rx="4" fill="#fcebc4" stroke="#f2a600" stroke-width="1"/>
<text x="171" y="146.2" font-size="12" text-anchor="middle" fill="#191919"></text>
<rect x="196" y="120" width="66" height="44" rx="4" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<text x="229" y="146.2" font-size="12" text-anchor="middle" fill="#191919">ingresso</text>
<rect x="270" y="120" width="150" height="44" rx="4" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<text x="345" y="146.2" font-size="12" text-anchor="middle" fill="#191919">i nodi del grafo</text>
<rect x="428" y="120" width="62" height="44" rx="4" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<text x="459" y="146.2" font-size="12" text-anchor="middle" fill="#191919">uscita</text>
<rect x="498" y="120" width="178" height="44" rx="4" fill="#f4f4f4" stroke="#d9d9d9" stroke-width="1"/>
<text x="587" y="146.2" font-size="12" text-anchor="middle" fill="#191919">attesa</text>
<rect x="680" y="120" width="42" height="44" rx="4" fill="#fcebc4" stroke="#f2a600" stroke-width="1"/>
<text x="701" y="146.2" font-size="12" text-anchor="middle" fill="#191919"></text>
<text x="171" y="182" font-size="11.5" text-anchor="middle" fill="#666666">risveglio</text>
<text x="171" y="197" font-size="11.5" text-anchor="middle" fill="#666666">3–8 µs</text>
<line x1="198" y1="178" x2="490" y2="178" stroke="#257de0" stroke-width="2"/>
<text x="344" y="196" font-size="12" text-anchor="middle" fill="#191919">fase di calcolo: nessun ingresso nel kernel</text>
<line x1="498" y1="178" x2="676" y2="178" stroke="#666666" stroke-width="2"/>
<text x="587" y="196" font-size="12" text-anchor="middle" fill="#191919">fase di attesa:</text>
<text x="587" y="211" font-size="12" text-anchor="middle" fill="#191919">una chiamata bloccante</text>
<line x1="150" y1="84" x2="150" y2="168" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="590" y1="84" x2="590" y2="168" stroke="#f47230" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="680" y1="84" x2="680" y2="168" stroke="#dc3c3d" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="150" y="78" font-size="11.5" text-anchor="middle" fill="#191919">periodo dovuto</text>
<text x="590" y="78" font-size="11.5" text-anchor="middle" fill="#191919">bilancio</text>
<text x="680" y="78" font-size="11.5" text-anchor="middle" fill="#191919">scadenza</text>
<line x1="592" y1="100" x2="678" y2="100" stroke="#666666" stroke-width="1"/>
<text x="635" y="95" font-size="10.5" text-anchor="middle" fill="#666666">margine: 150 µs</text>
<line x1="40" y1="250" x2="720" y2="250" stroke="#d9d9d9" stroke-width="1"/>
<line x1="150" y1="246" x2="150" y2="254" stroke="#666666" stroke-width="1"/>
<text x="150" y="270" font-size="11.5" text-anchor="middle" fill="#666666">0</text>
<line x1="680" y1="246" x2="680" y2="254" stroke="#666666" stroke-width="1"/>
<text x="680" y="270" font-size="11.5" text-anchor="middle" fill="#666666">2 ms: il periodo dopo</text>
<text x="24" y="296" font-size="11.5" text-anchor="start" fill="#666666">Dopo il bilancio non si comincia un altro nodo: se ne restano, il ciclo è «tagliato». Meglio meno calcolo che un xrun.</text>
<text x="24" y="310.95" font-size="11.5" text-anchor="start" fill="#666666">La scadenza è il più vicino di tre istanti (passo P1.7b); nel caso semplice è la fine del periodo.</text>
</svg>
