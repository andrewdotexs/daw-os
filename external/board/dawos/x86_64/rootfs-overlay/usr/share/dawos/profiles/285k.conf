# dawOS boot profile "285k": Intel Core Ultra 9 285K, live CPUs 4-7.
#
# One "key=value" per line, no quotes; '#' starts a comment line. CPU sets
# use the kernel list format ("4-7", "0-3,8-15").
#
# This file is read twice:
# - at build time by post-image.sh, which turns the CPU sets into kernel
#   parameters (isolcpus=, nohz_full=, rcu_nocbs=, irqaffinity=) of the
#   boot profile of the same name inside the signed unified kernel image;
# - at boot by dawos-tune, which checks that the machine and the running
#   kernel match it and applies everything that is set at run time.
# The two can therefore never disagree.

# Text shown in the boot menu.
title=285K, live CPUs 4-7

# --- The machine this profile describes -------------------------------------
# dawos-tune applies nothing on any other machine.
cpu_model=Intel(R) Core(TM) Ultra 9 285K
cpus=24
# P-cores, as /sys/devices/cpu_core/cpus reports them.
performance_cores=0-7

# --- CPU domains (document 0, C-03) -------------------------------------------
# Together they cover every CPU exactly once.
#
# live: the audio engine. Removed from the scheduler's balancing: only
# threads placed there on purpose run on them.
live=4-7
# preemptive: everything else of the DAW (anticipative rendering, user
# interface, disk streaming). CPUs 0-3 and the first two E-core clusters.
preemptive=0-3,8-15
# system: system services. Third E-core cluster.
system=16-19
# io: interrupt handlers. Fourth E-core cluster.
io=20-23

# tickless: CPUs that stop their periodic tick while they run one thread,
# and whose RCU callbacks run elsewhere. The live CPUs plus two P-cores in
# reserve. Never CPU 0: the kernel keeps the boot CPU for timekeeping.
tickless=2-7

# --- Run-time tuning of the live CPUs -------------------------------------------
# Frequency: "base" pins them to the frequency the processor guarantees at
# any load (cpufreq/base_frequency). A number is a frequency in kHz.
# 4.6 GHz was chosen in step P0.6b and measured again in step P0.6c on
# firmware 3402, with all 24 CPUs at full load: the live CPUs hold it
# exactly, at 71 C and 122 W. They also hold 4.9 GHz; asked for 5.2 GHz
# they run at about 5.1 GHz (80 C), asked for 5.5 at about 5.3 (85 C).
# The base frequency is 3.7 GHz. What the driver offers depends on the
# firmware: with 3402 the steps are 62.5 MHz wide and 3.7, 4.0, 4.3, 4.6
# and 4.9 GHz are all met; with 2301 only 4.0, 4.2, 4.6 and 4.8 GHz
# existed above the base, and a request in between was rounded down.
live_frequency=4600000
# Their energy preference is not a setting of the profile: dawos-tune
# gives them the one of the other CPUs. With "performance" on the live
# CPUs only, the processor held the other twenty back by a third at full
# load (measured in step P0.6c); the live CPUs hold 4.6 GHz either way.
# --- Frequency of the performance cores that are not live -----------------------
# "max": lowest and highest allowed frequency both at the top the
# processor offers; a number is a frequency in kHz; without this line
# they are left to the processor. Measured in step P0.6d (open point
# A-33): left alone, the performance cores of the preemptive domain did
# short bursts of work at about 1.3 GHz, and while they did, a live CPU
# at rest woke up as much as 55 us late. With their frequency fixed at
# the top it was 8 us, and the same work kept them busy for 2 % of the
# time instead of 11. Lowering only their highest frequency did not
# help. The efficiency cores have no such effect and are left alone.
preemptive_pcore_frequency=max

# --- Idle state of the live CPUs ------------------------------------------------
# Deepest idle state they may enter: "poll" (never halt) or the name of a
# state, such as "c1". On this machine the firmware declares no idle
# state, so the kernel has nothing to choose: a stopped CPU is in C1, or
# in C1E if the firmware entry "Enhanced C-states" is on. Measured: a
# wake-up from C1E takes about 6 us longer (up to 13), from C1 0.2 us.
# "c1" therefore requires that entry to be "Disabled"; dawos-tune reads
# it from the processor at every boot and fails if it is not (ADR 0009).
live_idle=c1

# Fair server: the part of every second (50 ms by default) the kernel
# keeps for normal threads on a CPU that real-time threads would
# otherwise fill. Its timer reaches a live CPU once a second even when
# nothing is starving (measured in step P0.6a: one rescheduling interrupt
# per second and per CPU; none with the server off). "off" disables it on
# the live CPUs only. The price: a real-time thread that never sleeps can
# then starve the kernel threads bound to its CPU. Experiment E-02 of
# step P0.6b measures that case; "on" leaves the kernel default.
live_fair_server=off

# --- Graphics driver ----------------------------------------------------------------
# Driver of the integrated GPU, loaded by dawos-tune at every boot; it
# must take the GPU, or the profile is not applied in full. Not a matter
# of pictures: when the firmware lights a screen and no driver takes it
# over, the live CPUs lose 10 to 20 us at a time under a load that moves
# much memory. Measured in step P1.0, same boot and same load: wake-ups
# up to 19 us without the driver, 7 us with it. It is the tail the
# 24 hours of the campaign of step P0.7 had found (20.7 us). "xe" is the
# only driver that can be built for this GPU on a real-time kernel
# (ADR 0022). Without this line no driver is loaded.
graphics_driver=xe

# --- Package power limit, in watts ------------------------------------------------
# The cooling of the reference machine was validated at this value (step
# P0.4b). The firmware is set to it; if the firmware ever hands over a
# higher limit, dawos-tune lowers it. It is never raised.
power_limit_w=160
