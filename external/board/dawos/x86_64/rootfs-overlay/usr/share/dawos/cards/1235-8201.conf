# Focusrite Scarlett 18i20, 2nd generation (USB 1235:8201): the known
# state of its router and mixer, for dawos-card-setup (step P1.4).
#
# It is the state read from the interface of the project on 21 November
# 2026 (docs/misure/fase-1/scheda-18i20-seconda-generazione.txt), every
# writable control of it. What matters to the engine:
#
# - every capture channel takes its hardware input, in order: analogue
#   1-8, S/PDIF 1-2, ADAT 1-8;
# - line outputs 1-4 play the playback channels 1-4; outputs 5-10 (5-6
#   and the two headphone pairs) play the mixes A and B of the
#   interface, as it came;
# - the clock is the internal one;
# - line outputs 1-2 follow the knob of the front panel ("HW"), the
#   others are at full level.
#
# Names and values are those of `amixer contents`.

