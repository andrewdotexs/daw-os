<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Dove passa il tempo del giro dentro l'interfaccia a 48 kHz, con il kernel di serie e con la patch" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Dove passa il tempo del giro dentro l'interfaccia a 48 kHz, con il kernel di serie e con la patch</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="399" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24" y="34" font-size="15" text-anchor="start" fill="#191919" font-weight="600">Dove stanno i millisecondi del giro (48 kHz, forma 96:3)</text>
<text x="24" y="54" font-size="11.5" text-anchor="start" fill="#666666">Giro dentro l'interfaccia, dal motore al motore; letto sul bus USB nei passi P1.8b e P1.8c</text>
<line x1="190" y1="88" x2="190" y2="310" stroke="#d9d9d9" stroke-width="1"/>
<text x="190" y="326" font-size="11" text-anchor="middle" fill="#666666">0 ms</text>
<line x1="272" y1="88" x2="272" y2="310" stroke="#d9d9d9" stroke-width="1"/>
<text x="272" y="326" font-size="11" text-anchor="middle" fill="#666666">2 ms</text>
<line x1="354" y1="88" x2="354" y2="310" stroke="#d9d9d9" stroke-width="1"/>
<text x="354" y="326" font-size="11" text-anchor="middle" fill="#666666">4 ms</text>
<line x1="436" y1="88" x2="436" y2="310" stroke="#d9d9d9" stroke-width="1"/>
<text x="436" y="326" font-size="11" text-anchor="middle" fill="#666666">6 ms</text>
<line x1="518" y1="88" x2="518" y2="310" stroke="#d9d9d9" stroke-width="1"/>
<text x="518" y="326" font-size="11" text-anchor="middle" fill="#666666">8 ms</text>
<line x1="600" y1="88" x2="600" y2="310" stroke="#d9d9d9" stroke-width="1"/>
<text x="600" y="326" font-size="11" text-anchor="middle" fill="#666666">10 ms</text>
<text x="178" y="119" font-size="12" text-anchor="end" fill="#191919">di serie, una fetta</text>
<rect x="191" y="100" width="244" height="28" rx="4" fill="#257de0"/>
<rect x="437" y="100" width="120.18" height="28" rx="4" fill="#f47230"/>
<rect x="559.18" y="100" width="21.37" height="28" rx="4" fill="#00b894"/>
<text x="313" y="119" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="600">6,00</text>
<text x="497.09" y="119" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="600">2,98</text>
<text x="589.55" y="119" font-size="11.5" text-anchor="start" fill="#666666">0,57   in tutto 9,54 ms</text>
<text x="178" y="175" font-size="12" text-anchor="end" fill="#191919">di serie, quattro fette</text>
<rect x="191" y="156" width="244" height="28" rx="4" fill="#257de0"/>
<rect x="437" y="156" width="98.45" height="28" rx="4" fill="#f47230"/>
<rect x="537.45" y="156" width="22.19" height="28" rx="4" fill="#00b894"/>
<text x="313" y="175" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="600">6,00</text>
<text x="486.225" y="175" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="600">2,45</text>
<text x="568.64" y="175" font-size="11.5" text-anchor="start" fill="#666666">0,59   in tutto 9,04 ms</text>
<text x="178" y="231" font-size="12" text-anchor="end" fill="#191919">con la patch, una fetta</text>
<rect x="191" y="212" width="244" height="28" rx="4" fill="#257de0"/>
<rect x="437" y="212" width="43.1" height="28" rx="4" fill="#f47230"/>
<rect x="482.1" y="212" width="26.29" height="28" rx="4" fill="#00b894"/>
<text x="313" y="231" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="600">6,00</text>
<text x="458.55" y="231" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="600">1,10</text>
<text x="517.39" y="231" font-size="11.5" text-anchor="start" fill="#666666">0,69   in tutto 7,79 ms</text>
<text x="178" y="287" font-size="12" text-anchor="end" fill="#191919">con la patch, quattro fette</text>
<rect x="191" y="268" width="244" height="28" rx="4" fill="#257de0"/>
<rect x="437" y="268" width="12.35" height="28" rx="4" fill="#f47230"/>
<rect x="451.35" y="268" width="26.29" height="28" rx="4" fill="#00b894"/>
<text x="313" y="287" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="600">6,00</text>
<text x="486.64" y="287" font-size="11.5" text-anchor="start" fill="#666666">0,35 e 0,69   in tutto 7,04 ms</text>
<rect x="90" y="354" width="14" height="10" rx="3" fill="#257de0"/>
<text x="110" y="363" font-size="11.5" text-anchor="start" fill="#191919">il buffer: tre cicli del motore</text>
<rect x="300" y="354" width="14" height="10" rx="3" fill="#f47230"/>
<text x="320" y="363" font-size="11.5" text-anchor="start" fill="#191919">l'uscita presso il controller USB</text>
<rect x="530" y="354" width="14" height="10" rx="3" fill="#00b894"/>
<text x="550" y="363" font-size="11.5" text-anchor="start" fill="#191919">interfaccia e avvio</text>
</svg>
