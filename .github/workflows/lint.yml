# Static checks that need neither Buildroot nor the target hardware.
name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      # The Buildroot submodule is deliberately not fetched: nothing here
      # needs it and it is not ours to lint.
      - uses: actions/checkout@v4

      # One entry point for local and automated checks: the tool versions
      # live in the Makefile only.
      - name: shellcheck and markdownlint
        run: make lint
