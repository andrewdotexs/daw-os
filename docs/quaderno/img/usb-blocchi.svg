<line x1="698" y1="170" x2="698" y2="200" stroke="#257de0" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="538" y1="170" x2="538" y2="200" stroke="#f47230" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="24" y="252" font-size="11.5" text-anchor="start" fill="#666666">il periodo del motore: 96 frame, 2 ms, annunciato dal blocco che lo completa (frecce blu)</text>
<line x1="24" y1="268" x2="44" y2="268" stroke="#f47230" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="52" y="272" font-size="11.5" text-anchor="start" fill="#666666">ogni tanto l'annuncio scatta un blocco prima</text>
<text x="24" y="300" font-size="11.5" text-anchor="start" fill="#666666">L'orologio dell'interfaccia e quello del bus non coincidono: sulla Scarlett di quarta generazione, undici volte all'ora,</text>
<text x="24" y="314.95" font-size="11.5" text-anchor="start" fill="#666666">un periodo è annunciato un millisecondo prima del solito (A-68). Un periodo che non è multiplo di 1 ms arriva a scatti.</text>
</svg>
