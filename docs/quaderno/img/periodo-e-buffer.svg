<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Frame, periodo e buffer con la forma 96:3 a 48 kHz" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Frame, periodo e buffer con la forma 96:3 a 48 kHz</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="329" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24" y="34" font-size="15" text-anchor="start" fill="#191919" font-weight="600">Frame, periodo e buffer: la forma 96:3 a 48 kHz</text>
<text x="24" y="72" font-size="12" text-anchor="start" fill="#666666">Un periodo: 96 frame, 2 ms</text>
<rect x="24" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
<rect x="33" y="82" width="7" height="26" rx="1.5" fill="#cce3fd" stroke="#257de0" stroke-width="1"/>
